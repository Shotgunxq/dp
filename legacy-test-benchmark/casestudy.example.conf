# Case study on a real project. Copy this file to casestudy.conf and fill it in.
#   cp casestudy.example.conf casestudy.conf
# Lines starting with # are comments. The real project is only READ and compiled (its target/ folder);
# no file in it is changed. Generated tests and results stay in this benchmark folder.

[project]
# short name, used for the folder names
name = myproject
# folder of the Maven MODULE that contains the classes (where its pom.xml is)
dir = /Users/me/work/legacy-app/billing-module
# relative to dir
sources = src/main/java
classes_dir = target/classes
# command that compiles the module (run inside dir). If it needs the other modules first, use e.g.
#   mvn -q -B -DskipTests install -pl billing-module -am -f ../pom.xml
build = mvn -q -B -ntp -DskipTests compile
# command that writes the dependency classpath to the file {out} (run inside dir)
classpath = mvn -q -B -ntp dependency:build-classpath -Dmdep.outputFile={out}
# JDK for compiling/running the tests; empty = the default java on PATH
java_home =

[classes]
# fully qualified names, one per line. Start SMALL: 3-5 classes, add more once it works.
list =
    com.example.billing.InvoiceCalculator
    com.example.billing.DiscountRules
    com.example.util.DateParser

[run]
# iterations 1..N, seed = 41 + iteration (same rule as the benchmark)
iterations = 1
# any of: llm evosuite randoop
tools = llm evosuite randoop
models =
    hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ4_XS
    Qwen3-Coder:latest
prompts = naive full
# Randoop / EvoSuite seconds per class, Randoop max tests per class
budget = 60
randoop_limit = 500
# limits so one bad suite cannot block the night
test_timeout_s = 900
pit_timeout_min = 120
